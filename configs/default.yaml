# Default training configuration. Any key can be overridden on the command line,
# e.g. `python -m src.train --config configs/default.yaml --loss focal --epochs 5`.

data_dir: null            # set with --data-dir (Kaggle: /kaggle/input/data)
out_dir: outputs/densenet121_wbce

backbone: densenet121     # densenet121 | resnet50 | efficientnet_b0
pretrained: true          # ImageNet weights
img_size: 224
dropout: 0.0

loss: weighted_bce        # bce | weighted_bce | focal | asl
lr: 0.0001
weight_decay: 0.00001
batch_size: 32
epochs: 10
patience: 3               # early stopping on validation mean AUROC

val_frac: 0.1             # fraction of train_val *patients* held out for validation
seed: 42
num_workers: 2
amp: true                 # mixed precision (GPU only)
subset: 0                 # >0 = train on this many images only (smoke test)
